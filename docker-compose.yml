# Optional: run MySQL in Docker.   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: creditguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: creditguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
