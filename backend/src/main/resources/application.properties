# Reads backend/.env automatically (KEY=VALUE lines). Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/creditguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# tables are created / updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:CreditGuardBot}
app.admin-key=${ADMIN_KEY:admin123}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
